<!doctype html>
<html lang="en" class="h-full scroll-smooth bg-brand-bg text-brand-text">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var realFetch = window.fetch;
          var fetchHandler = realFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return fetchHandler;
            },
            set: function(val) {
              fetchHandler = val;
            }
          });
        } catch (err) {}

        window.addEventListener('error', function(e) {
          if (
            (e.filename && e.filename.indexOf('chrome-extension://') !== -1) ||
            (e.message && e.message.indexOf('Cannot set property fetch of #<Window>') !== -1)
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (
            e.reason &&
            typeof e.reason.message === 'string' &&
            e.reason.message.indexOf('Cannot set property fetch of #<Window>') !== -1
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
    <link rel="icon" type="image/png" href="/icon128.png" />
    <title>Coffee Time — Gentle screen-break reminders for traders</title>
    <meta name="description" content="Coffee Time is a free Chrome extension that dims the glare and turns your cursor into a barista once your focus limit is up — a gentle nudge to step away and brew a cup." />
    <meta name="theme-color" content="#0B2331" />
    <link rel="canonical" href="https://coffeetimefortrader.world/" />
    <meta property="og:title" content="Coffee Time — Gentle screen-break reminders for traders" />
    <meta property="og:description" content="Set a focus limit. When time is up the page dims and your cursor becomes a barista — cueing you to rest and brew a cup. Free on the Chrome Web Store." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://coffeetimefortrader.world/" />
    <meta property="og:image" content="/icon128.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  </head>
  <body class="min-h-full m-0 p-0 antialiased selection:bg-brand-peach selection:text-brand-bg">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
